<style>
:root{--a1:#e8590c;--a2:#d6285a;--bg:#f3f4f8;--glass:#ffffffb8;--solid:#fff;--text:#10131a;--muted:#667085;--border:#e3e6ee;--shadow:0 10px 34px -14px #1a1f3a40;--up:#12a150;--down:#e5384a;color-scheme:light}
:root[data-theme=dark]{--bg:#080a10;--glass:#12161fb3;--solid:#141923;--text:#eef1f7;--muted:#97a3b8;--border:#232b39;--shadow:0 14px 40px -16px #000;--up:#35d07f;--down:#ff6b7a;color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.45 Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;min-height:100vh;overflow-x:hidden}
button,select,input{font:inherit}
.aurora{position:fixed;inset:0;z-index:-1;overflow:hidden;pointer-events:none}
.aurora i{position:absolute;width:60vmax;height:60vmax;border-radius:50%;filter:blur(110px);opacity:.26;animation:float 26s ease-in-out infinite alternate}
.aurora i:nth-child(1){background:var(--a1);top:-25vmax;left:-20vmax}
.aurora i:nth-child(2){background:var(--a2);bottom:-30vmax;right:-20vmax;animation-delay:-9s}
.aurora i:nth-child(3){background:#5b6cff;top:25%;left:40%;width:38vmax;height:38vmax;opacity:.12;animation-delay:-15s}
@keyframes float{to{transform:translate(9vmax,7vmax) scale(1.18)}}
header{position:sticky;top:0;z-index:30;background:var(--glass);backdrop-filter:blur(20px) saturate(1.6);-webkit-backdrop-filter:blur(20px) saturate(1.6);border-bottom:1px solid var(--border);padding:calc(10px + env(safe-area-inset-top)) 14px 0}
.wrap{max-width:1500px;margin:0 auto}
.top{display:flex;align-items:center;gap:8px}
.logo{display:flex;align-items:center;gap:9px;text-decoration:none;color:inherit;flex:none}
.logo svg{width:36px;height:36px;filter:drop-shadow(0 4px 12px color-mix(in srgb,var(--a1) 55%,transparent))}
.logo b{font-size:1.28rem;letter-spacing:-.6px;font-weight:800}
.grad{background:linear-gradient(90deg,var(--a1),var(--a2));-webkit-background-clip:text;background-clip:text;color:transparent}
.search{flex:1;position:relative;max-width:620px;margin:0 auto}
.search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);opacity:.5;pointer-events:none}
#q{width:100%;padding:9px 44px 9px 38px;border-radius:14px;border:1px solid var(--border);background:var(--solid);color:var(--text);font-size:15px;outline:none;transition:box-shadow .2s,border-color .2s}
#q:focus{border-color:var(--a1);box-shadow:0 0 0 4px color-mix(in srgb,var(--a1) 22%,transparent)}
.kbd{position:absolute;right:10px;top:50%;transform:translateY(-50%);font-size:11px;border:1px solid var(--border);border-radius:6px;padding:1px 6px;color:var(--muted);pointer-events:none}
.ctl{border:1px solid var(--border);background:var(--solid);color:var(--text);border-radius:12px;padding:0 11px;font-size:14px;cursor:pointer;transition:transform .15s,box-shadow .2s,border-color .2s;height:38px;display:inline-flex;align-items:center;justify-content:center;gap:6px;flex:none}
.ctl:hover{transform:translateY(-1px);box-shadow:var(--shadow);border-color:var(--a1)}
.ctl:active{transform:scale(.95)}
select.ctl{max-width:132px;padding:0 8px}
#refresh.spin svg{animation:rot .8s linear infinite}
@keyframes rot{to{transform:rotate(360deg)}}
.hide-s{display:inline-flex}
nav{display:flex;gap:6px;overflow-x:auto;padding:10px 0;scrollbar-width:none;scroll-snap-type:x proximity}
nav::-webkit-scrollbar{display:none}
nav button{flex:none;scroll-snap-align:start;border:1px solid transparent;background:transparent;color:var(--muted);border-radius:999px;padding:6px 14px;font-size:14px;font-weight:600;cursor:pointer;transition:all .2s;white-space:nowrap}
nav button:hover{color:var(--text);background:var(--solid)}
nav button.on{background:linear-gradient(135deg,var(--a1),var(--a2));color:#fff;box-shadow:0 8px 22px -8px var(--a1)}
.only-m{display:none}
.strip{display:flex;gap:8px;overflow-x:auto;padding:10px 14px 2px;max-width:1500px;margin:0 auto;scrollbar-width:none}
.strip::-webkit-scrollbar{display:none}
.st{flex:none;display:flex;align-items:baseline;gap:7px;background:var(--glass);border:1px solid var(--border);border-radius:12px;padding:6px 11px;font-size:13px;backdrop-filter:blur(10px)}
.st small{color:var(--muted);font-weight:600}
.st b{font-variant-numeric:tabular-nums}
.up{color:var(--up)}.down{color:var(--down)}
.layout{max-width:1500px;margin:0 auto;padding:12px 14px 50px;display:grid;grid-template-columns:minmax(0,1fr);gap:18px}
@media(min-width:1100px){.layout{grid-template-columns:minmax(0,1fr) 340px}}
aside{display:none}
@media(min-width:1100px){aside{display:flex;flex-direction:column;gap:14px;position:sticky;top:112px;align-self:start;max-height:calc(100vh - 124px);overflow-y:auto;scrollbar-width:thin;padding-right:2px}}
@media(max-width:1099px){.only-m{display:inline-block}}
.wg{background:var(--glass);border:1px solid var(--border);border-radius:18px;padding:14px;backdrop-filter:blur(14px);box-shadow:var(--shadow)}
.wg h3{margin:0 0 10px;font-size:13px;letter-spacing:.4px;text-transform:uppercase;color:var(--muted);display:flex;align-items:center;gap:6px}
.live{width:8px;height:8px;border-radius:50%;background:#ff3b3b;animation:pulse 1.4s infinite;display:inline-block}
@keyframes pulse{0%{box-shadow:0 0 0 0 #ff3b3b88}100%{box-shadow:0 0 0 9px #ff3b3b00}}
.cities{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.city{background:var(--solid);border:1px solid var(--border);border-radius:12px;padding:8px 10px;display:flex;flex-direction:column;gap:1px;font-size:12px;color:var(--muted)}
.city b{color:var(--text);font-size:13px}
.city .clk{font-variant-numeric:tabular-nums;font-weight:700;color:var(--text);font-size:15px}
.city .tmp{font-size:13px}
.row{display:flex;gap:10px;align-items:center;padding:7px 0;border-top:1px solid var(--border);font-size:13px;text-decoration:none;color:inherit}
.row:first-of-type{border-top:0}
.row:hover b{color:var(--a1)}
.row .mag{flex:none;width:38px;height:28px;border-radius:8px;display:grid;place-items:center;color:#fff;font-weight:800;font-size:13px}
.row small{color:var(--muted)}
.row img{width:38px;height:38px;border-radius:9px;object-fit:cover;flex:none}
.row .n{flex:none;width:22px;text-align:center;color:var(--muted);font-weight:800}
.row div{min-width:0}
.row b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tag{border:1px solid var(--border);background:var(--solid);color:var(--text);border-radius:999px;padding:3px 10px;font-size:12.5px;cursor:pointer;transition:all .2s}
.tag:hover{border-color:var(--a1);color:var(--a1);transform:translateY(-1px)}
.tag i{color:var(--muted);font-style:normal;margin-left:4px;font-size:11px}
#status{color:var(--muted);font-size:13px;margin:4px 0 10px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
#status .bar{height:4px;width:90px;border-radius:4px;background:var(--border);overflow:hidden}
#status .bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--a1),var(--a2));transition:width .3s}
#status .warn{color:var(--down);cursor:help}
#chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:10px;scrollbar-width:none}
#chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--border);background:var(--solid);color:var(--text);border-radius:999px;padding:4px 11px 4px 8px;font-size:12.5px;cursor:pointer;display:flex;align-items:center;gap:6px;transition:all .2s}
.chip:hover{border-color:var(--a1)}
.chip.on{background:var(--text);color:var(--bg);border-color:var(--text)}
.chip img{width:14px;height:14px;border-radius:3px}
.chip i{font-style:normal;opacity:.6;font-size:11px}
#grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(235px,1fr));gap:14px}
.card{position:relative;background:var(--glass);backdrop-filter:blur(10px);border:1px solid var(--border);border-radius:18px;overflow:hidden;display:flex;flex-direction:column;box-shadow:var(--shadow);cursor:pointer;outline:none;transition:transform .28s cubic-bezier(.2,.8,.2,1),box-shadow .28s,border-color .2s}
.card:hover,.card:focus-visible{transform:translateY(-4px);border-color:color-mix(in srgb,var(--a1) 60%,var(--border))}
.card.new{animation:up .55s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i,0)*28ms)}
@keyframes up{from{opacity:0;transform:translateY(20px) scale(.97)}}
.card .im{aspect-ratio:16/10;overflow:hidden;background:linear-gradient(135deg,var(--border),transparent);position:relative}
.card .im::after{content:"";position:absolute;inset:auto 0 0;height:45%;background:linear-gradient(transparent,#0006);pointer-events:none}
.card img.ph{width:100%;height:100%;object-fit:cover;display:block;transition:transform .7s}
.card:hover img.ph{transform:scale(1.07)}
.body{padding:11px 13px 13px;display:flex;flex-direction:column;gap:6px;flex:1}
.meta{font-size:12px;color:var(--muted);display:flex;gap:7px;align-items:center;flex-wrap:wrap}
.meta img{width:14px;height:14px;border-radius:3px}
.src{color:var(--a1);font-weight:700}
.tr{font-size:10.5px;border:1px solid var(--border);border-radius:6px;padding:0 5px}
.now{font-size:10px;font-weight:800;letter-spacing:.6px;color:#fff;background:#ff3b3b;border-radius:6px;padding:1px 6px;animation:blink 1.6s infinite}
@keyframes blink{50%{opacity:.55}}
.card h2{margin:0;font-size:.98rem;line-height:1.28;font-weight:700;letter-spacing:-.15px}
.card p{margin:0;font-size:13px;color:var(--muted);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.ab{position:absolute;top:9px;z-index:2;width:34px;height:34px;border-radius:50%;border:0;background:#0009;color:#fff;font-size:16px;cursor:pointer;backdrop-filter:blur(6px);transition:transform .2s;display:grid;place-items:center;text-decoration:none}
.ab:hover{transform:scale(1.12)}
.fav{right:9px}
.ext{right:49px}
.fav.on{background:linear-gradient(135deg,var(--a1),var(--a2));animation:pop .35s}
@keyframes pop{50%{transform:scale(1.35)}}
#hero:empty{display:none}
#hero{margin-bottom:14px}
.card.hero{flex-direction:row;min-height:340px;border:1px solid transparent;background:linear-gradient(var(--solid),var(--solid)) padding-box,linear-gradient(135deg,var(--a1),var(--a2)) border-box}
.card.hero .im{aspect-ratio:auto;flex:1.5}
.card.hero .body{flex:1;justify-content:center;padding:26px;gap:10px}
.card.hero h2{font-size:1.75rem;letter-spacing:-.7px;line-height:1.18}
.card.hero p{-webkit-line-clamp:5;font-size:15px}
.card.hero.noimg .body{padding:30px}
body[data-view=mag] #grid{grid-template-columns:repeat(auto-fill,minmax(330px,1fr))}
body[data-view=mag] .card h2{font-size:1.12rem}
body[data-view=list] #grid{grid-template-columns:1fr;gap:8px}
body[data-view=list] .card{flex-direction:row-reverse;border-radius:14px;box-shadow:none}
body[data-view=list] .card:hover{transform:translateX(3px)}
body[data-view=list] .card .im{aspect-ratio:auto;width:140px;flex:none}
body[data-view=list] .card .im::after{display:none}
body[data-view=list] .ab{top:6px;width:28px;height:28px;font-size:13px}
body[data-view=list] .ext{display:none}
body[data-view=list] .card p{-webkit-line-clamp:2}
.skel{height:300px;border-radius:18px;background:linear-gradient(100deg,var(--glass) 30%,var(--border) 50%,var(--glass) 70%);background-size:300% 100%;animation:sk 1.3s infinite}
@keyframes sk{to{background-position:-300% 0}}
.empty{grid-column:1/-1;text-align:center;color:var(--muted);padding:60px 10px}
#sentinel{height:60px;display:grid;place-items:center;color:var(--muted);font-size:13px}
#install{background:linear-gradient(135deg,var(--a1),var(--a2));color:#fff;border-color:transparent;font-weight:700}
#install.done{display:none}
.help ol{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:8px;color:var(--text);font-size:15px;line-height:1.5}
.help h3{margin:8px 0 0;font-size:14px;color:var(--muted);text-transform:uppercase;letter-spacing:.4px}
footer{text-align:center;color:var(--muted);font-size:12px;padding:6px 16px 36px}
#toTop{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom));width:46px;height:46px;border-radius:50%;border:0;color:#fff;background:linear-gradient(135deg,var(--a1),var(--a2));font-size:19px;cursor:pointer;box-shadow:var(--shadow);opacity:0;transform:translateY(20px);pointer-events:none;transition:all .3s;z-index:40}
#toTop.show{opacity:1;transform:none;pointer-events:auto}
#info{display:none}
body[data-tab=info] #info{display:flex;flex-direction:column;gap:14px}
body[data-tab=info] #feed{display:none}
#drawer{position:fixed;inset:0;z-index:100;display:none}
#drawer.open{display:block}
#drawer .ov{position:absolute;inset:0;background:#0009;backdrop-filter:blur(6px);animation:fade .25s}
@keyframes fade{from{opacity:0}}
#drawer .sh{position:absolute;right:0;top:0;bottom:0;width:min(560px,100%);background:var(--solid);border-left:1px solid var(--border);overflow-y:auto;animation:slide .35s cubic-bezier(.2,.8,.2,1);display:flex;flex-direction:column}
@keyframes slide{from{transform:translateX(40px);opacity:0}}
@media(max-width:700px){#drawer .sh{top:auto;height:88vh;border-radius:22px 22px 0 0;border-left:0;animation:rise .35s cubic-bezier(.2,.8,.2,1)}@keyframes rise{from{transform:translateY(60px);opacity:0}}}
.sh .hd{display:flex;gap:8px;padding:12px;position:sticky;top:0;background:var(--solid);z-index:2;border-bottom:1px solid var(--border);align-items:center}
.sh .hd .sp{flex:1}
.sh img.big{width:100%;max-height:330px;object-fit:cover;display:block}
.sh .ct{padding:18px 20px 30px;display:flex;flex-direction:column;gap:12px}
.sh h2{margin:0;font-size:1.5rem;line-height:1.2;letter-spacing:-.5px}
.sh p{margin:0;color:var(--muted);font-size:15.5px;line-height:1.6}
.sh .acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
.btn{border:0;border-radius:12px;padding:0 16px;height:42px;font-weight:700;cursor:pointer;color:#fff;background:linear-gradient(135deg,var(--a1),var(--a2));text-decoration:none;display:inline-flex;align-items:center;gap:6px;transition:transform .15s}
.btn:hover{transform:translateY(-1px)}
.btn.sec{background:var(--bg);color:var(--text);border:1px solid var(--border)}
.rd{padding:6px 20px 40px;display:flex;flex-direction:column;gap:14px}
.rd .tools{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.rd h1{margin:4px 0 0;font-size:1.65rem;line-height:1.2;letter-spacing:-.6px}
.rd .by{color:var(--muted);font-size:13.5px}
.rd .bd{font-size:var(--rs,17px);line-height:1.75;color:var(--text);overflow-wrap:anywhere}
.rd .bd p{margin:0 0 1em;font-size:inherit;line-height:inherit;color:inherit}
.rd .bd h2,.rd .bd h3,.rd .bd h4{line-height:1.25;margin:1.4em 0 .5em;letter-spacing:-.3px}
.rd .bd img,.rd .bd video{max-width:100%;height:auto;border-radius:12px;display:block;margin:1em auto}
.rd .bd figure{margin:1em 0}.rd .bd figcaption{font-size:.8em;color:var(--muted);text-align:center}
.rd .bd a{color:var(--a1);text-decoration:underline;text-underline-offset:3px}
.rd .bd blockquote{margin:1em 0;padding:.2em 1em;border-left:4px solid var(--a1);color:var(--muted)}
.rd .bd ul,.rd .bd ol{padding-left:1.3em}.rd .bd pre{overflow:auto;background:var(--bg);padding:12px;border-radius:10px}
.rd .bd table{display:block;overflow:auto;max-width:100%}
.rd .note{background:color-mix(in srgb,var(--a1) 12%,transparent);border:1px solid color-mix(in srgb,var(--a1) 40%,var(--border));border-radius:12px;padding:10px 12px;font-size:14px}
.rd .ld{display:flex;flex-direction:column;gap:10px}.rd .ld i{display:block;height:14px;border-radius:7px;background:linear-gradient(100deg,var(--border) 30%,var(--bg) 50%,var(--border) 70%);background-size:300% 100%;animation:sk 1.3s infinite}
.ctl.sm{height:34px;min-width:34px;font-size:13px;padding:0 10px}
#toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,30px);background:var(--text);color:var(--bg);padding:10px 18px;border-radius:12px;font-size:14px;opacity:0;pointer-events:none;transition:all .3s;z-index:200}
#toast.show{opacity:1;transform:translate(-50%,0)}
.ticker{overflow:hidden;white-space:nowrap;font-size:13px;color:var(--muted);border-top:1px solid var(--border)}
.ticker div{display:inline-block;padding:7px 0;animation:tick 120s linear infinite}
.ticker:hover div{animation-play-state:paused}
.ticker a{color:inherit;text-decoration:none;margin-right:34px;cursor:pointer}
.ticker a::before{content:"●";color:var(--a1);margin-right:8px;font-size:9px;vertical-align:1px}
.ticker a:hover{color:var(--text)}
@keyframes tick{to{transform:translateX(-50%)}}
#lang{margin-left:auto}
header{transition:transform .3s cubic-bezier(.2,.8,.2,1);padding-left:max(14px,env(safe-area-inset-left));padding-right:max(14px,env(safe-area-inset-right))}
.strip,.layout{padding-left:max(14px,env(safe-area-inset-left));padding-right:max(14px,env(safe-area-inset-right))}
.card.noim .meta{padding-right:86px;min-height:34px}
.card.noim .body{padding-top:14px}
.card.noim h2{font-size:1.08rem}
.card.noim p{-webkit-line-clamp:7}
body[data-view=list] .card.noim .meta{padding-right:40px}
@media(pointer:coarse){
  .ctl{height:42px;min-width:42px}
  nav button{padding:9px 16px}
  .ab{width:40px;height:40px;font-size:18px}.ext{right:55px}
  .chip{padding:7px 13px 7px 10px}
  .tag{padding:6px 12px}
}
@media(max-width:1099px){.strip{padding-top:8px}}
@media(max-width:900px){
  .search{order:5;flex-basis:100%;max-width:none;margin:2px 0 0}.top{flex-wrap:wrap}.kbd{display:none}
  header.hid{transform:translateY(-100%)}
  #grid{grid-template-columns:repeat(auto-fill,minmax(250px,1fr))}
  .card.hero{min-height:300px}.card.hero h2{font-size:1.45rem}
}
@media(max-width:640px){
  .hide-s{display:none}
  .ticker{display:none}
